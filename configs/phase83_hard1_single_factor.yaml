experiment_name: phase83_hard1_single_factor_calibration
dataset_name: phase83_hard1_calibration_300
dataset_version: phase83.hard1.v1
readme_title: Phase 83 Hard-1 single-factor calibration pool
phase: development_calibration_only
not_a_locked_test: true
locked_test_tuning_forbidden: true
episodes_per_variant: 100
seed_offset: 0

common:
  obstacle_zone_x: [-2.5, 3.0]
  target_crossing_required: false
  minimum_bypass_routes: 1
  initial_escape_lookahead_steps: 4
  initial_escape_clearance_limit_m: 0.60
  max_sampling_attempts_per_group: 500

# Hard-1 increases one physically interpretable factor per block.  The target
# keeps the obstacle-avoidance-first contract: it starts on the outer side of
# the obstacle, does not require a central crossing, and never requests an
# intentional reverse lane change.
base_profile:
  difficulty_label: hard1
  target_motion_mode: adaptive_maneuvering
  target_speed_scales: [0.50, 0.60]
  initial_side_distances: [6.0, 6.5]
  obstacle_count_range: [3, 3]
  observation_condition: hard1_base
  pursuit_overrides:
    detection_range: 14.0
    detection_dropout_probability: 0.12
    observation_noise_std: 0.025
    message_delay_steps: 1
    message_dropout_probability: 0.03
    target_maneuver_observation_delay_steps: 1
    target_maneuver_observation_noise_std: 0.08
    target_maneuver_observation_dropout_probability: 0.08
    target_maneuver_replan_interval_steps: 8
    target_maneuver_min_hold_steps: 6
    target_maneuver_horizon_steps: 16
    target_maneuver_feasibility_margin_m: 0.60
    target_maneuver_obstacle_avoidance_gain: 5.0
    target_maneuver_crossing_gain: 0.0
    target_maneuver_enable_reverse_lane_change: false
  execution:
    action_delay_steps: 1
    command_noise_std_mps: 0.025
  defender_y_scale: 1.0
  single_factor: baseline
  single_factor_value: 0.0

# Three 100-scene blocks are enough to open Hard-1 while keeping attribution
# clean.  The values are individually motivated by factors that already passed
# the Nominal-plus teacher gate; action_delay=2 is intentionally excluded.
seed_blocks:
  target_speed: 831201
  obstacle_near: 831301
  formation_tight: 831401

variants:
  target_speed:
    observation_condition: hard1_target_speed
    target_speed_scales: [0.55, 0.65]
    single_factor: target_speed_scales
    single_factor_value: [0.55, 0.65]
  obstacle_near:
    observation_condition: hard1_obstacle_near
    initial_side_distances: [4.5, 5.0]
    target_obstacle_clearance_max_m: 2.40
    single_factor: initial_side_distances
    single_factor_value: [4.5, 5.0]
  formation_tight:
    observation_condition: hard1_formation_tight
    defender_y_scale: 0.65
    single_factor: defender_y_scale
    single_factor_value: 0.65

expert_calibration:
  controllers:
    - oracle_route
    - public_belief_route
  use_local_cbf: true
  minimum_acceptance_rate_for_training: 0.80
  accepted_scene_requires:
    - safe_capture_in_pursuit
    - no_target_boundary_violation
    - no_defender_boundary_violation
    - no_defender_physical_collision

evaluation:
  locked_test_used: false
  report_latency_percentiles: [50, 95, 99]
  local_cbf_is_empirical_filter_only: true
  formal_robust_cbf_qp_claim: false
