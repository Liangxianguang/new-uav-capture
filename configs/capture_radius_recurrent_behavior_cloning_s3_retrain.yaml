experiment_name: capture_radius_recurrent_behavior_cloning_s3_retrain
environment_config: capture_radius_pursuit_central_v4_flee.yaml

# Standalone clean-clone retraining contract. It collects a new quality-gated
# expert archive locally; it does not claim to recreate unpublished V4/V5
# historical archives or checkpoints.
imitation:
  seed: 661606
  device: cuda
  episodes: 320
  expert_max_attempts_per_episode: 8
  expert_max_rejection_rate: 0.25
  expert_collection_checkpoint_every_accepted_episodes: 16
  expert_require_safe_capture: true
  expert_require_cooperative_safe_capture: true
  training_obstacle_counts: [3]
  training_target_speed_scales: [0.45, 0.55]
  training_target_motion_modes: [flee_persistence, s_curve]
  training_required_defender_zone_entries: 2
  training_showcase_stages:
    - until_progress: 1.0
      showcase_probability: 1.0
      randomized_central_probability: 0.85
      randomized_obstacle_count_range: [3, 5]
      layouts: [mixed]
      initial_side_distances: [6.0, 6.5, 7.0, 7.5]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55]
      target_motion_modes: [flee_persistence, s_curve]
      target_crossing_probability: 0.0
      required_defender_zone_entries: 2
  learning_rate: 0.00005
  action_scale_mode: full_range
  hidden_dim: 128
  epochs: 64
  validation_episodes: 10
  recurrent_reset_interval_steps: 1
