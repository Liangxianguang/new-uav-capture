experiment_name: phase71_maneuvering_defender_finetune
not_a_locked_test: true
locked_test_tuning_forbidden: true
research_task:
  name: defender_domain_adaptation_to_maneuvering_adversary_v2
  primary_scope: multi_seed_validation_and_recurrent_defender_finetuning
  excluded_scope: locked_test_selection_and_formal_safety_certificate
environment_config: phase70_maneuvering_adversary_v2.yaml

# Warm-start from the released V5 recurrent actor.  The new archive is collected
# only on development/training scenes and is never evaluated on locked_test.
imitation:
  seed: 711101
  device: cpu
  initialize_from: ../models/v5_development_exact_reactive_seed661606.pt
  episodes: 48
  expert_max_attempts_per_episode: 1
  expert_max_rejection_rate: 1.0
  expert_collection_checkpoint_every_accepted_episodes: 16
  # This is domain-adaptation data, not a claim that the rule expert solves
  # every adaptive target.  Failed demonstrations remain diagnostics and are
  # excluded from any locked-test claim.
  expert_require_safe_capture: false
  expert_require_cooperative_safe_capture: false
  training_obstacle_counts: [3, 4, 5]
  training_target_speed_scales: [0.45, 0.55, 0.65]
  # Duplicate the stationary baselines to keep the fine-tune stable while
  # exposing the actor to the new mode in every curriculum stage.
  training_target_motion_modes: [flee_persistence, flee_persistence, s_curve, adaptive_maneuvering]
  training_required_defender_zone_entries: 1
  training_showcase_stages:
    - until_progress: 1.0
      showcase_probability: 1.0
      randomized_central_probability: 0.35
      randomized_obstacle_count_range: [3, 5]
      layouts: [mixed, cylinder_box, wall]
      initial_side_distances: [6.0, 7.0, 8.0]
      defender_sides: [left, right]
      target_speed_scales: [0.45, 0.55, 0.65]
      target_motion_modes: [flee_persistence, flee_persistence, s_curve, adaptive_maneuvering]
      target_crossing_probability: 0.25
      target_crossing_speed_scales: [0.45, 0.55]
      required_defender_zone_entries: 1
  learning_rate: 0.00002
  action_scale_mode: full_range
  hidden_dim: 128
  epochs: 8
  validation_episodes: 2
  recurrent_reset_interval_steps: 1
