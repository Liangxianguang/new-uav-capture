experiment_name: phase55_uakr_queue_risk_development
environment_config: capture_radius_pursuit_central_v4_flee.yaml

# Development-only intervention calibration.  This block adds one transparent
# public feature to UAKR; it does not change the queue authority, planner cost,
# or safety interface.  The single weight is frozen before the run and is not
# selected on locked-test.
phase17:
  queue_aware_rollout: true
  queue_aware_safety_projection: true
  adaptive_k: true
  reachability_normalized_cost: false
  execution:
    enabled: true
    action_delay_steps: 4
    pending_command_authority: immutable
    command_noise_std: 0.08
    command_noise_bound_sigma: 3.0
    clip_command_noise: true
    velocity_time_constant_seconds: 0.0
    drag_coefficient: 0.0

planner:
  implementation: finite_shooting_scenario_mpc
  dt_seconds: 0.1
  horizon_steps: 8
  control_horizon_steps: 3
  max_speed_mps: 5.0
  capture_radius_m: 0.80
  drone_radius_m: 0.25
  safety_margin_m: 0.35
  minimum_inter_agent_distance_m: 1.00
  risk_mode: worst_case
  cvar_alpha: 0.75
  role_perimeter_m: 1.40
  slot_gain: 2.5
  target_velocity_gain: 1.0
  weight_distance: 1.0
  weight_terminal_distance: 3.0
  weight_capture_hinge: 1.5
  weight_formation: 0.25
  weight_control: 0.015
  weight_control_change: 0.02
  weight_obstacle: 25.0
  weight_boundary: 25.0
  weight_inter_agent: 25.0
  weight_relative_speed: 0.02
  max_role_variants: 4
  perimeter_scales: [0.75, 1.0]

prediction:
  candidate_source: checkpoint
  candidate_status_required: projected
  num_samples: 8
  sampling_steps: 8
  sampling_seed: 745102
  projection_iterations: 4
  refresh_interval_steps: 1
  adaptive_budget:
    low_threshold: 0.35
    high_threshold: 0.65
    low_k: 1
    medium_k: 4
    high_k: 8
    low_refresh_interval_steps: 4
    medium_refresh_interval_steps: 2
    high_refresh_interval_steps: 1
    max_cache_age_steps: 4
    hysteresis: 0.05
    covariance_scale: 0.50
    message_age_scale_steps: 8.0
    speed_ratio_scale: 0.80
    residual_scale_m: 0.50
    covariance_weight: 0.30
    age_weight: 0.20
    confidence_weight: 0.20
    speed_weight: 0.15
    cache_weight: 0.05
    residual_weight: 0.05
    queue_prefix_risk_scale_m: 0.50
    queue_prefix_risk_buffer_m: 0.15
    queue_prefix_risk_weight: 0.30

distributed:
  communication_mode: delayed
  max_iterations: 3
  convergence_tolerance_mps: 0.15
  communication_interval_steps: 1
  message_delay_steps: 0
  message_dropout_probability: 0.0
  max_message_age_steps: 8
  local_timeout_ms: 50.0
  max_local_candidate_paths: 4
  local_obstacle_range_m: 8.0
  bytes_per_float: 8
  fallback_policy: fallback_actions_then_previous_sequence

evaluation:
  split: validation_development
  methods: [distributed_delayed]
  candidate_source: checkpoint
  safety_layer: local_cbf
  decision: validation_selection
  target_truth_online_prediction: false
  paired_scene_prefix_episodes: 100

reporting:
  tensorboard_required: true
  preserve_episode_jsonl: true
  preserve_step_jsonl: true
  preserve_summary_json: true
  preserve_config_snapshot: true
  preserve_source_hashes: true
  report_solver_status: true
  report_fallback_reason: true
  report_latency_percentiles: [50, 95, 99]
