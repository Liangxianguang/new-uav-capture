experiment_name: phase5_robust_cbf_qp_validation
environment_config: capture_radius_pursuit_central_v4_flee.yaml

safety:
  gamma: 0.25
  safety_margin_m: 0.35
  disturbance_margin_m: 0.10
  observation_error_margin_m: 0.06
  delay_margin_m: 0.20
  execution_margin_m: 0.10
  max_speed_mps: 5.0
  max_acceleration_mps2: 6.0
  action_change_limit_mps: null
  slack_enabled: false
  action_weight: 1.0
  slack_weight: 1000000.0
  slack_tolerance_m: 0.000001
  solver_tolerance: 0.00000001
  solver_max_iterations: 100
  fallback_policy: barrier_recovery

evaluation:
  episodes: 8
  seed_start: 649101
  obstacle_count: 3
  target_speed_scale: 0.45
  target_motion_mode: flee_persistence
  max_steps: 250
  methods:
    - nominal
    - local_cbf
    - robust_cbf_qp
  control_cycle_budget_ms: 100.0

reporting:
  tensorboard_required: true
  preserve_episode_jsonl: true
  preserve_step_jsonl: true
  preserve_summary_json: true
  preserve_config_snapshot: true
  preserve_source_hashes: true
  report_certificate_reasons: true
