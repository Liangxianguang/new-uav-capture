experiment_name: phase56_strong_baseline_matrix
stage: development_then_locked_diagnostic
episodes_minimum: 360
mirror_groups_minimum: 180
groups_per_block: 60
seeds: [727201, 727202, 727203]

# The generator creates three disjoint blocks. Each mirror group contains one
# upper and one lower episode and is assigned to exactly one split.
blocks:
  - name: id_reference
    factors:
      action_delay_steps: [4]
      command_noise_std: [0.08]
      message_delay_steps: [2]
      message_dropout_probability: [0.05]
      velocity_time_constant_seconds: [0.0]
  - name: delay_noise_grid
    factors:
      action_delay_steps: [0, 2, 4, 6, 8]
      command_noise_std: [0.00, 0.04, 0.08, 0.12]
  - name: communication_execution_grid
    factors:
      message_dropout_probability: [0.00, 0.10, 0.20, 0.30]
      message_delay_steps: [0, 2, 4]
      velocity_time_constant_seconds: [0.0, 0.10]

methods:
  - id: B0_current_state_delayed_mpc
    qdr: false
    tube_mpc: false
    distributed_mode: synchronous
  - id: B1_qdr_mpc
    qdr: true
    tube_mpc: false
    distributed_mode: synchronous
  - id: B2_fixed_tube_mpc
    qdr: false
    tube_mpc: fixed_calibration_only
    distributed_mode: synchronous
  - id: B3_queue_aware_tube_mpc
    qdr: queue_alignment_only
    tube_mpc: fixed_calibration_only
    distributed_mode: synchronous
  - id: B4_synchronous_distributed_mpc
    qdr: false
    tube_mpc: false
    distributed_mode: synchronous
  - id: B5_asynchronous_distributed_mpc
    qdr: false
    tube_mpc: false
    distributed_mode: asynchronous
  - id: B6_qdr_asynchronous_mpc
    qdr: true
    tube_mpc: false
    distributed_mode: asynchronous
  - id: B7_fixed_k8_qdr
    qdr: true
    tube_mpc: false
    adaptive_k: false
    candidate_count: 8

fairness:
  predictor_condition: both
  sampling_seed: 745102
  sampling_steps: 8
  projection_iterations: 4
  horizon_steps: 8
  control_horizon_steps: 3
  torch_num_threads: 1
  torch_num_interop_threads: 1
  same_wall_time_budget: true
  same_candidate_limit: true

split_policy:
  development_calibration: mirror_group_disjoint
  development_confirmation: mirror_group_disjoint
  locked_diagnostic: frozen_only
  locked_tuning: forbidden

reporting:
  tensorboard_required: true
  jsonl_required: true
  latency_percentiles: [50, 95, 99]
  components: [predictor, planner, qdr_or_tube, safety, total_control]
  local_cbf_claim: empirical_filter_only
  robust_clbf_qp_proof: not_claimed

