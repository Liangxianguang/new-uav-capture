experiment_name: phase27_rnic_formation_slot_pilot
environment_config: capture_radius_pursuit_central_v4_flee.yaml

# Isolated validation pilot for innovation 3.  Queue-aware rollout and UAKR
# are disabled so any change is attributable to the RNIC cost definition.
# This is a validation configuration, not a locked-test tuning recipe.
phase17:
  queue_aware_rollout: false
  queue_aware_safety_projection: false
  adaptive_k: false
  reachability_normalized_cost: true
  execution:
    enabled: true
    action_delay_steps: 2
    command_noise_std: 0.0
    command_noise_bound_sigma: 3.0
    clip_command_noise: true

planner:
  implementation: finite_shooting_scenario_mpc
  dt_seconds: 0.1
  horizon_steps: 8
  control_horizon_steps: 3
  max_speed_mps: 5.0
  capture_radius_m: 0.80
  drone_radius_m: 0.25
  safety_margin_m: 0.35
  minimum_inter_agent_distance_m: 1.00
  risk_mode: worst_case
  cvar_alpha: 0.75
  role_perimeter_m: 1.40
  slot_gain: 2.5
  target_velocity_gain: 1.0
  weight_distance: 1.0
  weight_terminal_distance: 3.0
  weight_capture_hinge: 1.5
  weight_formation: 0.25
  weight_control: 0.015
  weight_control_change: 0.02
  weight_obstacle: 25.0
  weight_boundary: 25.0
  weight_inter_agent: 25.0
  weight_relative_speed: 0.02
  weight_reachability: 1.0
  reachability_cost_mode: formation_slot
  reachability_slot_radius_m: 1.40
  reachability_time_margin_s: 0.15
  reachability_time_scale_s: 0.50
  reachability_max_acceleration_mps2: 6.0
  max_role_variants: 4
  perimeter_scales: [0.75, 1.0]

prediction:
  candidate_source: belief
  candidate_status_required: projected
  num_samples: 8
  sampling_steps: 8
  sampling_seed: 745102
  projection_iterations: 4
  refresh_interval_steps: 1

distributed:
  communication_mode: delayed
  max_iterations: 3
  convergence_tolerance_mps: 0.15
  communication_interval_steps: 1
  message_delay_steps: 2
  message_dropout_probability: 0.05
  max_message_age_steps: 8
  local_timeout_ms: 50.0
  max_local_candidate_paths: 4
  local_obstacle_range_m: 8.0

evaluation:
  split: phase27_rnic_validation
  methods: [worst_case]
  candidate_source: checkpoint
  safety_layer: local_cbf
  decision: validation_selection
  control_cycle_budget_ms: 100.0

reporting:
  tensorboard_required: true
  preserve_episode_jsonl: true
  preserve_summary_json: true
  preserve_config_snapshot: true
  preserve_source_hashes: true
  report_solver_status: true
  report_fallback_reason: true
  report_latency_percentiles: [50, 95, 99]
