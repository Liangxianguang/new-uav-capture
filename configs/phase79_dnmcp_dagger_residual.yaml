experiment_name: phase79_dnmcp_teacher_dagger_residual
not_a_locked_test: true
locked_test_tuning_forbidden: true
environment_config: phase70_maneuvering_adversary_v2.yaml
mpc_config: innovation_mpc.yaml

# These scene files are calibration/validation artifacts only.  The target
# contract is inherited from Phase78: no intentional crossing or reverse lane
# change; smooth motion initially moves away from the nearest obstacle.
training_scene_file: ../results/phase78_oracle_calibration_nominal/accepted_calibration_scenes.jsonl
evaluation_scene_file: ../results/phase78_oracle_calibration_nominal/accepted_calibration_scenes.jsonl

environment_overrides:
  dynamics:
    execution:
      enabled: true
      action_delay_steps: 1
      command_noise_std: 0.02
  task:
    pursuit:
      target_motion_mode: adaptive_maneuvering
      target_maneuver_replan_interval_steps: 8
      target_maneuver_min_hold_steps: 6
      target_maneuver_horizon_steps: 16
      target_maneuver_feasibility_margin_m: 0.60
      target_maneuver_obstacle_avoidance_gain: 5.0
      target_maneuver_crossing_gain: 0.0
      target_maneuver_enable_reverse_lane_change: false

experiment:
  seed: 791501
  demo_episodes: 192
  dagger_rounds: 2
  episodes_per_round: 24
  hidden_dim: 128
  residual_scale_mps: 2.5
  learning_rate: 0.0005
  epochs: 20
  sequence_length: 32
  sequence_batch_size: 16
  teacher_horizon_seconds: 0.75
  teacher_replan_interval_steps: 8
  teacher_min_hold_steps: 6
  teacher_grid_step_m: 0.75
  teacher_route_margin_m: 0.85
  # The teacher remains distributed DN-MPC, but its public plan is refreshed
  # every 8 control steps so 192 demonstrations are practical on CPU.
  dnmpc_candidate_count: 4
  dnmpc_replan_interval_steps: 8
  dnmpc_max_iterations: 2
  dnmpc_communication_interval_steps: 1
  dnmpc_message_delay_steps: 1
  dnmpc_max_message_age_steps: 8
  dnmpc_local_timeout_ms: 50.0
  recovery_action_gap_m: 0.35
  recovery_cbf_correction_mps: 0.20
  dt_seconds: 0.1
